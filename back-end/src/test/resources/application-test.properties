# Perfil de teste.
#
# Testes unitarios e slices (@WebMvcTest) nao tocam banco.
# Testes de integracao (*IT) sobrevem o MySQL via Testcontainers e sobrescrevem
# a datasource atraves de @ServiceConnection — ver AbstractIntegrationIT.
#
# O default aqui e deliberadamente sem banco, para que um teste que dependa de
# banco sem declarar o container falhe de forma obvia, em vez de silenciosamente
# acertar o MySQL de desenvolvimento da maquina do dev.

spring.application.name=NexusFinance-test

# Segredo fixo: tokens gerados em teste precisam ser reproduziveis.
app.auth.secret=test-secret-with-at-least-32-characters-long
app.cors.allowed-origin=http://localhost:5173

# Flyway so roda nos testes de integracao, que o reabilitam explicitamente.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# MonthlyForecastConcurrencyIT roda 5 threads que pegam PESSIMISTIC_WRITE na mesma
# linha. Com o pool default (10) e timeout de 30s, uma espera por bloqueio pode
# ser confundida com pool esgotado. Pool maior e timeout curto fazem a falha, se
# houver, apontar para o lugar certo.
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000

# Menos ruido no log de teste; suba para DEBUG quando investigar uma falha.
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
