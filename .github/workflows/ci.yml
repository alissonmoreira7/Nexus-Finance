name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  back-end:
    name: Back-end · testes e cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Testes unitarios, de integracao e gate de cobertura
        run: ./mvnw -B verify

      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back-end/target/site/jacoco/
          retention-days: 14

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            back-end/target/surefire-reports/
            back-end/target/failsafe-reports/
          retention-days: 14

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
              END {printf "## Cobertura\n\n| Métrica | Valor |\n|---|---|\n"
                   printf "| Linha | %.1f%% (%d/%d) |\n", 100*lc/(lm+lc), lc, lm+lc
                   printf "| Branch | %.1f%% (%d/%d) |\n", 100*bc/(bm+bc), bc, bm+bc}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
